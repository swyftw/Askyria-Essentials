name: AskyriaEssentials
version: 1.0.0
main: com.askyria.essentials.AskyriaEssentials
api-version: '1.21'
author: Askyria
description: Askyria server essentials
commands:
  discord:
    description: Show the Askyria SMP Discord invite
    usage: /discord
  top1:
    description: Give a player the yellow TOP1 rank
    usage: /top1 <player>
  top2:
    description: Give a player the gray TOP2 rank
    usage: /top2 <player>
  top3:
    description: Give a player the bronze TOP3 rank
    usage: /top3 <player>
  top4:
    description: Give a player the TOP4 rank
    usage: /top4 <player>
  top5:
    description: Give a player the TOP5 rank
    usage: /top5 <player>
  protection:
    description: Clear your own new-player protection
    usage: /protection clear
  cleartag:
    description: Completely remove a player's tag
    usage: /cleartag <player>
  playertag:
    description: Set a player's gradient tag
    usage: /playertag <player> <tag> fade3 OR /playertag <player> <tag> fade <color1> <color2> <color3> OR /playertag clear <player>
  invsee:
    description: View a player's inventory
    usage: /invsee <player>
  endersee:
    description: View a player's Ender Chest
    usage: /endersee <player>
  endclosed:
    description: Close access to the End
    usage: /endclosed
  endopen:
    description: Open access to the End
    usage: /endopen
  orbital:
    description: Give and use Orbital TNT strike items (OP only)
    usage: /orbital [@s] <kit|rain|stab|nuke|lunar|grapple>
